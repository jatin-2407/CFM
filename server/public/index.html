<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CFM2 Projects</title>
<link rel="stylesheet" href="/theme.css">
<style>
.page { max-width: 980px; margin: 0 auto; padding: 72px 24px 96px; }
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 40px; }
h1 { font-size: 48px; line-height: 1.08; font-weight: 700; letter-spacing: -0.03em; margin: 0; }
header p { margin: 8px 0 0; font-size: 19px; color: var(--muted); letter-spacing: -0.015em; }
.new {
    display: inline-block; text-decoration: none; font-size: 15px; font-weight: 500; padding: 11px 22px; border-radius: 980px;
    background: var(--ledger); color: #fff;
}
.new:hover { background: var(--ledger-hover); }

.projects { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
.project {
    display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 20px 32px; align-items: center;
    padding: 28px 32px; background: var(--sheet); border-radius: 22px; box-shadow: var(--shadow);
}
.project:hover { box-shadow: var(--shadow-lift); }
.project a.name { color: var(--ink); font: 600 22px/1.2 var(--display); letter-spacing: -0.02em; text-decoration: none; word-break: break-word; }
.project a.name:hover { color: var(--ledger); }
.meta { font-size: 14px; color: var(--muted); margin-top: 6px; }

.done { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.done b { color: var(--ink); font-weight: 600; white-space: nowrap; }
.done .bar { height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; margin-top: 10px; }
.done .bar i { display: block; height: 100%; border-radius: 3px; background: var(--ledger); }

.actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; padding-top: 20px; border-top: 1px solid var(--rule); }
.actions button, .actions .button, .rename button {
    display: inline-block; text-decoration: none; white-space: nowrap; line-height: 1.3;
    font-size: 14px; font-weight: 500; padding: 8px 16px; border-radius: 980px; cursor: pointer;
    border: 0; background: var(--fill); color: var(--ink);
}
.actions button:hover, .actions .button:hover { background: color-mix(in srgb, var(--fill) 80%, var(--ink) 8%); }
.actions .label { background: var(--ledger); color: #fff; }
.actions .label:hover { background: var(--ledger-hover); }
.actions button.delete { margin-left: auto; background: none; color: var(--stamp); }
.actions button.delete:hover { background: var(--stamp-soft); }
.rename { display: flex; gap: 8px; }
.rename input {
    flex: 1; min-width: 0; font: 600 20px/1.2 var(--display); color: var(--ink);
    background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; padding: 8px 12px;
}
.rename button.save { background: var(--ledger); color: #fff; }
.row-note { grid-column: 1 / -1; font-size: 13px; color: var(--stamp); margin: 0; }
.row-note:empty { display: none; }

.empty { padding: 72px 32px; text-align: center; background: var(--sheet); border-radius: 22px; box-shadow: var(--shadow); }
.empty p { color: var(--muted); font-size: 17px; margin: 0 0 24px; }
.error-box { background: var(--stamp-soft); color: var(--stamp); border-radius: 14px; padding: 16px 20px; }

@media (max-width: 720px) {
    .page { padding: 40px 16px 64px; }
    h1 { font-size: 36px; }
    header p { font-size: 17px; }
    .project { grid-template-columns: 1fr; padding: 22px 20px; border-radius: 18px; }
    .actions button.delete { margin-left: 0; }
}
</style>
</head>
<body>
<div class="page">
    <header>
        <div><h1>Projects</h1><p>Label messages once. Classify them forever.</p></div>
        <a class="new" href="/seed.html">New project</a>
    </header>
    <ul class="projects" id="projects" aria-live="polite"></ul>
</div>

<script src="/classifier.js"></script>
<script>
const $ = id => document.getElementById(id);
const escape = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => n.toLocaleString();
const when = iso => new Date(iso).toLocaleString(undefined, { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

let projects = [];

async function load() {
    try {
        const res = await fetch('/api/projects');
        projects = await res.json();
        if (!res.ok) throw new Error(projects.error);
        draw();
    } catch (err) {
        $('projects').outerHTML = `<div class="error-box">Could not load projects: ${escape(err.message)}. Check that the server is running.</div>`;
    }
}

function draw() {
    if (!projects.length) {
        $('projects').innerHTML = `<li class="empty"><p>No projects yet. A project starts from a text file of messages, one per line.</p><a class="new" href="/seed.html">New project</a></li>`;
        return;
    }
    $('projects').innerHTML = projects.map(row).join('');
}

function row(p) {
    const pct = p.leaves ? p.labelledLeaves / p.leaves * 100 : 0;
    return `<li class="project" data-id="${p.id}">
        <div class="title">
            <a class="name" href="/label.html?project=${p.id}">${escape(p.name)}</a>
            <div class="meta">${fmt(p.messages)} messages${p.file ? ` from ${escape(p.file)}` : ''}, ${when(p.created)}${p.seeded && p.seeded !== p.created ? `, seeded again ${when(p.seeded)}` : ''}</div>
        </div>
        <div class="done">${fmt(p.labelledLeaves)} of ${fmt(p.leaves)} patterns labelled, <b>${Math.floor(pct)}% done</b>${p.cfmRes ? '<br>CFMRes exported' : ''}
            <div class="bar"><i style="width:${pct}%"></i></div></div>
        <div class="actions">
            <a class="button label" href="/label.html?project=${p.id}">${pct < 100 ? 'Label' : 'Open'}</a>
            ${p.cfmRes ? `<button type="button" data-act="check">Check classifier</button>
                <button type="button" data-act="download" title="patterns.json, labels.dat and placeholder.dat">Download CFMRes</button>` : ''}
            <a class="button" href="/seed.html?project=${p.id}">Seed again</a>
            <button type="button" data-act="rename">Rename</button>
            <button type="button" data-act="delete" class="delete">Delete</button>
        </div>
        <p class="row-note"></p>
    </li>`;
}

// Rename in place: the name turns into a box; Enter or Save keeps it, Escape or Cancel puts it back.
function startRename(li, p) {
    const title = li.querySelector('.title');
    title.innerHTML = `<form class="rename"><input value="${escape(p.name)}" aria-label="Project name" maxlength="120">
        <button class="save" type="submit">Save</button><button type="button" data-act="cancel">Cancel</button></form>`;
    const input = title.querySelector('input');
    input.select();
    title.querySelector('form').addEventListener('submit', async e => {
        e.preventDefault();
        const name = input.value.trim();
        if (!name) { note(li, 'Give the project a name.'); return input.focus(); }
        const res = await fetch(`/api/projects/${p.id}`, { method: 'PATCH', body: JSON.stringify({ name }) });
        const body = await res.json();
        if (!res.ok) return note(li, `Not renamed: ${body.error}.`);
        Object.assign(p, body);
        li.outerHTML = row(p);
        document.querySelector(`.project[data-id="${p.id}"] [data-act="rename"]`).focus();
    });
    input.addEventListener('keydown', e => { if (e.key === 'Escape') cancel(li, p); });
}
function cancel(li, p) {
    li.outerHTML = row(p);
    document.querySelector(`.project[data-id="${p.id}"] [data-act="rename"]`).focus();
}
const note = (li, text) => { li.querySelector('.row-note').textContent = text; };

async function remove(li, p) {
    if (!confirm(`Delete "${p.name}"? Its groups, labels and CFMRes are deleted for good. The word-to-num keeps its words.`)) return;
    const res = await fetch(`/api/projects/${p.id}`, { method: 'DELETE' });
    if (!res.ok) return note(li, `Not deleted: ${(await res.json()).error}.`);
    projects = projects.filter(x => x.id !== p.id);
    draw();
}

$('projects').addEventListener('click', e => {
    const button = e.target.closest('button[data-act]');
    if (!button) return;
    const li = button.closest('.project');
    const p = projects.find(x => x.id === li.dataset.id);
    ({ rename: startRename, delete: remove, cancel, check: () => openClassifier(p.id, p.name), download: () => downloadCFMRes(p.id).catch(err => note(li, `Not downloaded: ${err.message}.`)) })[button.dataset.act](li, p);
});

load();
</script>
</body>
</html>
